schema_version: 1
description: >-
  City-level analysis definitions.  These are documentation and validation
  inputs; the authoritative frozen split dates remain in
  src/urbanflow/manifest.json.
cities:
  Porto:
    dataset: ECML/PKDD taxi trajectories
    release_id: UNKNOWN
    grid_ny_nx: [32, 32]
    cell_size_m: 250
    dt_min: 60
    phases_per_day: 24
    time_window: full day
    split: "252 dates; chronological 151 TRAIN / 50 VAL / 51 TEST"
  SF:
    dataset: Cabspotting
    release_id: UNKNOWN
    grid_ny_nx: [32, 88]
    cell_size_m: 250
    dt_min: 60
    phases_per_day: 24
    time_window: full day
    split: "15 dates; five blocked folds of 9 TRAIN / 3 VAL / 3 TEST"
