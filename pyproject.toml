[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "urbanflow"
version = "1.0.0"
description = "Frozen reference implementation for road-supported effective mobility coupling"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "matplotlib>=3.6",
]

[project.optional-dependencies]
test = ["pytest>=7", "PyYAML>=6"]
docs = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
urbanflow = ["manifest.json", "goldens/*.json"]
